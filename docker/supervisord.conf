[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:mosquitto]
user=broker
command=/usr/sbin/mosquitto -c /data/mosquitto/mosquitto.conf
priority=10
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
user=broker
environment=HOME="/home/broker"
command=uvicorn app.main:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips=* --no-access-log
directory=/srv
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:remote]
; Accesso remoto all'in-out: pagine, API e websocket inoltrati attraverso la connessione MQTT
user=broker
environment=HOME="/home/broker"
command=uvicorn app.remote:app --host 0.0.0.0 --port 8081 --proxy-headers --forwarded-allow-ips=* --no-access-log
directory=/srv
priority=25
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:enroll]
; Registrazione automatica degli in-out (HTTPS con il certificato del server)
user=broker
environment=HOME="/home/broker"
command=uvicorn app.enroll:app --host 0.0.0.0 --port 8884 --ssl-keyfile /data/pki/server.key --ssl-certfile /data/pki/server.crt --no-access-log
directory=/srv
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
