<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Broker{% endblock %} · Baron Pesi Broker MQTT</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <script>
    // Applica il tema prima del rendering (evita il lampo bianco): scelta salvata, altrimenti quella del sistema
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
{% if request.session.get('user') %}
<header class="topbar">
  <a class="brand" href="/"><img src="/static/logo.png" alt="Baron Pesi"><span>Broker MQTT</span></a>
  <nav>
    <a href="/" class="{{ 'active' if nav == 'dashboard' }}">Panoramica</a>
    <a href="/devices" class="{{ 'active' if nav in ('devices', 'device') }}">Dispositivi</a>
    <a href="/live" class="{{ 'active' if nav == 'live' }}">Live</a>
    <a href="/messages" class="{{ 'active' if nav in ('messages', 'message') }}">Storico</a>
    <a href="/broker" class="{{ 'active' if nav == 'broker' }}">Broker</a>
  </nav>
  <div class="topbar-actions">
  <button type="button" class="theme-toggle" data-theme-toggle title="Tema chiaro/scuro" aria-label="Cambia tema chiaro/scuro">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <form method="post" action="/logout" class="logout"><button class="btn ghost small">Esci</button></form>
  </div>
</header>
{% else %}
<div class="login-theme"><button type="button" class="theme-toggle" data-theme-toggle title="Tema chiaro/scuro" aria-label="Cambia tema chiaro/scuro">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button></div>
{% endif %}
<main class="{% block main_class %}container{% endblock %}">
  {% if flash %}<div class="flash {{ flash.kind }}">{{ flash.text }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
