# Broker MQTT per gli in-out + pannello di gestione, su un'unica porta pubblica (443).
#   cp .env.example .env   (imposta BROKER_HOST e ADMIN_PASSWORD)
#   docker compose up -d --build
#
# Sulla 443 il container "broker" smista le connessioni TLS in base all'ALPN (app/mux.py):
#   ALPN "mqtt"             -> Mosquitto (mTLS con certificato client)
#   ALPN "baronpesi-enroll" -> registrazione automatica degli in-out
#   altro (browser)         -> Caddy (Let's Encrypt) -> pannello e accesso remoto agli in-out
# La 80 serve solo a Caddy per il certificato Let's Encrypt e il redirect a HTTPS.
services:
  broker:
    build: .
    image: broker-events-baronpesi:latest
    container_name: mqtt-broker
    restart: unless-stopped
    env_file: .env
    environment:
      MUX_ENABLED: "1"
      MUX_WEB_UPSTREAM: "caddy:443"
    ports:
      - "${MUX_PUBLIC_PORT:-443}:8443"       # porta unica: in-out (MQTT + registrazione) e pannello
      # Porte separate per gli in-out non ancora aggiornati alla porta unica.
      # Toglile quando tutti gli in-out usano la 443 con ALPN.
      - "${BROKER_PUBLIC_PORT:-8883}:8883"   # MQTT su TLS
      - "${ENROLL_PUBLIC_PORT:-8884}:8884"   # registrazione automatica (HTTPS)
    expose:
      - "8080"                               # pannello: raggiunto solo da Caddy
    volumes:
      - broker_data:/data
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    container_name: mqtt-broker-caddy
    restart: unless-stopped
    environment:
      BROKER_HOST: ${BROKER_HOST}
    ports:
      - "80:80"                              # ACME HTTP-01 e redirect a HTTPS
    expose:
      - "443"                                # HTTPS: raggiunto solo dalla porta unica del broker
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - broker

volumes:
  broker_data:
  caddy_data:
  caddy_config:
