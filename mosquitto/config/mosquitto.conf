persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
acl_file /mosquitto/config/acl

listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
# Lista dei certificati revocati (generata da gen-certs.sh)
crlfile  /mosquitto/certs/crl.pem
# Lista dei certificati revocati (il file deve esistere, altrimenti il broker non parte)
crlfile  /mosquitto/certs/crl.pem

# Coda per i client con sessione persistente offline
max_queued_messages 10000
max_inflight_messages 20
